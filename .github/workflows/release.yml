name: Build & Release

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>$null || pip install -e .
          pip install pyinstaller PySide6

      - name: Build GUI one-file exe
        run: python build_exe.py --gui

      - name: Verify GUI artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/trace2skill-gui.exe")) {
            Write-Error "trace2skill-gui.exe not found in dist/"
            exit 1
          }
          # Smoke-test: no args should not crash on import (it will try to open a
          # window on the runner; we only assert the binary starts and exits).
          $size = [math]::Round((Get-Item "dist/trace2skill-gui.exe").Length / 1MB, 1)
          Write-Host "Built trace2skill-gui.exe ($size MB)"

      - name: Upload GUI exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/trace2skill-gui.exe
