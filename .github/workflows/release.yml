name: Build & Release

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>$null || pip install -e .
          pip install pyinstaller

      - name: Build exe
        run: python build_exe.py

      - name: Zip dist folder
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          Compress-Archive -Path dist/trace2skill/* -DestinationPath "trace2skill-${tag}-win64.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: trace2skill-*-win64.zip
